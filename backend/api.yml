openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  version: 1.0.12
servers:
  - url: https://localhost:3000/
tags:
  - name: users
    description: все пользователи
  - name: dashboard
    description: дашбоард

paths:
  /users:
    get:
      operationId: getUsersList
      tags:
        - users
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/UsersListRespones'
    post:
      operationId: createUser
      tags:
        - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Users'
      responses:
        201:
          $ref: '#/components/responses/UserRespones'

  /users/{userId}:
    patch:
      operationId: updateUser
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersPatch'
      responses:
        200:
          $ref: '#/components/responses/UsersListRespones'
    delete:
      operationId: deleteUser
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        204:
          description: пользователь удалён

components:
  schemas:
    UsersPatch:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Users:
      type: object
      required:
        - id
        - email
        - password
        - isActive
        - createdAt
      properties:
        id:
          type: number
        email:
          type: string
        password:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

  responses:
    UsersListRespones:
      description: Список пользователей
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Users'
    UserRespones:
      description: Пользователь
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Users'
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
