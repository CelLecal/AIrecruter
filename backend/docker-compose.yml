services:
  db:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_db
      JWT_SECRET: UusjRonV658VdE838pbAKuREfdCcJiospgrcIjQJEFF


    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      

  api:
    build: .
    container_name: my_node_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: your_password
      DB_NAME: your_db
      JWT_SECRET: UusjRonV658VdE838pbAKuREfdCcJiospgrcIjQJEFF

    depends_on:
      - db

volumes:
  pgdata:
